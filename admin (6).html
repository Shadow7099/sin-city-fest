<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel de Boletas - Sin City Fest</title>
    
    <style>
        @font-face {
            font-family: 'Barbra-Regular';
            src: url('https://tpdormyzwodptmtdksrs.supabase.co/storage/v1/object/sign/sin%20city%20fest/Barbra-Regular.otf?token=eyJraWQiOiI1NmY5Y2NkOC02ZDdlLTQ5YTQtYmRhMC1mZTVjY2I1Yzg1YjMiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJzaW4gY2l0eSBmZXN0L0JhcmJyYS1SZWd1bGFyLm90ZiIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3OTEwNDQ2OTYsImV4cCI6MTgyMjU4MDY5Nn0.jR0luJ2XcTGUXLwEe0I-nCTx4UDVcvoBAenS9bLZopnGTA0UCSFyDQ6XnDcQZsc2poGRZqwVQVD2CBebW1w99g') format('opentype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'LexieReadable-Bold';
            src: url('https://tpdormyzwodptmtdksrs.supabase.co/storage/v1/object/sign/sin%20city%20fest/LexieReadable-Bold.ttf?token=eyJraWQiOiI1NmY5Y2NkOC02ZDdlLTQ5YTQtYmRhMC1mZTVjY2I1Yzg1YjMiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJzaW4gY2l0eSBmZXN0L0xleGllUmVhZGFibGUtQm9sZC50dGYiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzkxMDQ0NzEzLCJleHAiOjE4MjI1ODA3MTN9.ffDyupRpB1FlCCxas35agP6dI0YAvDZ-GPfE5c500mbbKJQZ-aqFZld0dueF1UOZoc60GL3uAPhGna-uxB96xQ') format('truetype');
            font-weight: 700;
        }

        :root {
            --color-red: #E63946;
            --color-yellow: #F4D03F;
            --color-black: #1A1A1A;
            --color-cream: #E8DCC0;
            --display: 'Barbra-Regular', serif;
            --text: 'LexieReadable-Bold', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            background: var(--color-black);
            color: var(--color-cream);
            font-family: var(--text);
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        button, input, select, textarea {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 3px solid var(--color-yellow);
            outline-offset: 2px;
        }

        .hidden {
            display: none !important;
        }

        .wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* LOGIN */
        #login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            border: 3px solid var(--color-red);
            padding: 40px;
            text-align: center;
        }

        .login-box h1 {
            font-family: var(--display);
            font-size: 2.5rem;
            color: var(--color-yellow);
            text-shadow: 3px 3px 0 var(--color-black);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .login-box p {
            color: var(--color-cream);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .pin {
            width: 100%;
            font-size: 1.8rem;
            letter-spacing: 0.5em;
            text-align: center;
            padding: 16px;
            border: 2px solid var(--color-yellow);
            background: rgba(0, 0, 0, 0.5);
            color: var(--color-yellow);
            font-family: var(--display);
            margin-bottom: 20px;
        }

        .pin:focus {
            outline: none;
            border-color: var(--color-cream);
            box-shadow: 0 0 10px rgba(232, 220, 192, 0.3);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 30px;
            background: var(--color-yellow);
            color: var(--color-red);
            border: 3px solid var(--color-black);
            font-family: var(--display);
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--color-black);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--color-black);
        }

        .btn:active {
            transform: translate(0, 0);
            box-shadow: 2px 2px 0 var(--color-black);
        }

        .btn.block {
            width: 100%;
            margin-top: 20px;
        }

        .btn.ghost {
            background: var(--color-red);
            color: var(--color-cream);
        }

        .btn.sm {
            padding: 10px 16px;
            font-size: 0.95rem;
            box-shadow: 2px 2px 0 var(--color-black);
        }

        .msg {
            min-height: 1.3em;
            margin-top: 12px;
            font-weight: bold;
            color: #ff8a98;
        }

        .msg.ok {
            color: #7fe0a6;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(135deg, rgba(22, 11, 35, 0.98) 0%, rgba(26, 26, 26, 0.98) 100%);
            border-bottom: 3px solid var(--color-yellow);
            padding-top: env(safe-area-inset-top, 0px);
        }

        .head-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 0;
        }

        .head-row h1 {
            font-family: var(--display);
            font-size: 1.4rem;
            color: var(--color-yellow);
            text-shadow: 2px 2px 0 var(--color-black);
            margin: 0;
            letter-spacing: 1px;
        }

        .head-row h1 span {
            color: var(--color-cream);
        }

        .logout {
            background: var(--color-red);
            border: 2px solid var(--color-black);
            padding: 10px 16px;
            cursor: pointer;
            font-family: var(--text);
            font-weight: bold;
            color: var(--color-cream);
            box-shadow: 2px 2px 0 var(--color-black);
        }

        .logout:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 var(--color-black);
        }

        .tabs {
            display: flex;
            gap: 8px;
            padding-bottom: 12px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--color-yellow);
            color: var(--color-yellow);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .tab[aria-selected="true"] {
            background: var(--color-yellow);
            color: var(--color-black);
        }

        /* STATS */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .stat {
            background: linear-gradient(135deg, rgba(230, 57, 70, 0.2) 0%, rgba(244, 208, 63, 0.1) 100%);
            border: 2px solid var(--color-yellow);
            padding: 14px;
        }

        .stat b {
            display: block;
            font-family: var(--display);
            font-size: 1.8rem;
            color: var(--color-yellow);
            text-shadow: 2px 2px 0 var(--color-black);
            line-height: 1.1;
        }

        .stat span {
            font-size: 0.85rem;
            color: var(--color-cream);
        }

        /* PANELS */
        .panel {
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.8) 0%, rgba(15, 15, 15, 0.8) 100%);
            border: 3px solid var(--color-red);
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 5px 5px 0 var(--color-black);
        }

        .panel-head {
            background: var(--color-yellow);
            color: var(--color-black);
            padding: 14px 18px;
            font-family: var(--display);
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 3px solid var(--color-black);
            letter-spacing: 1px;
        }

        .panel-body {
            padding: 20px;
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 16px;
        }

        @media (max-width: 768px) {
            .grid2 {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-yellow);
            font-weight: bold;
            margin: 14px 0 6px;
        }

        .field {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--color-yellow);
            background: rgba(0, 0, 0, 0.5);
            color: var(--color-cream);
            font-size: 1rem;
            outline: none;
        }

        .field:focus {
            border-color: var(--color-cream);
            box-shadow: 0 0 10px rgba(232, 220, 192, 0.3);
        }

        /* LISTA */
        .rows {
            display: flex;
            flex-direction: column;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            padding: 14px;
            border-bottom: 1px solid var(--color-yellow);
            align-items: center;
        }

        .row-name {
            font-weight: bold;
            color: var(--color-cream);
        }

        .row-meta {
            font-size: 0.85rem;
            color: var(--color-yellow);
        }

        .pill {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            background: var(--color-red);
            color: var(--color-cream);
            margin-right: 6px;
        }

        .pill.vip {
            background: var(--color-yellow);
            color: var(--color-black);
        }

        .empty {
            padding: 24px;
            color: var(--color-yellow);
            text-align: center;
        }

        .result-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .card {
            background: linear-gradient(135deg, rgba(230, 57, 70, 0.1) 0%, rgba(0, 0, 0, 0.3) 100%);
            border: 2px solid var(--color-red);
            overflow: hidden;
        }

        .card img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 5;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            padding: 10px;
        }

        .card-actions .btn {
            flex: 1;
            font-size: 0.8rem;
            padding: 8px;
        }

        /* MODAL */
        #modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.95) 0%, rgba(15, 15, 15, 0.95) 100%);
            border: 3px solid var(--color-yellow);
            padding: 20px;
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        #modal-img {
            width: 100%;
            height: auto;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions .btn {
            flex: 1;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--color-red);
            border: 2px solid var(--color-black);
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--color-cream);
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="login">
        <div class="login-box">
            <h1>SIN CITY</h1>
            <p>Panel de Boletas</p>
            <input type="password" id="pin-input" class="pin" placeholder="••••" maxlength="4">
            <div id="msg" class="msg"></div>
            <button class="btn block" onclick="doLogin()">Entrar</button>
        </div>
    </div>

    <!-- ADMIN -->
    <div id="admin" class="hidden">
        <header>
            <div class="wrap">
                <div class="head-row">
                    <h1>SIN CITY <span>FEST</span></h1>
                    <button class="logout" onclick="logout()">Salir</button>
                </div>
                <div class="tabs">
                    <button class="tab" aria-selected="true" onclick="switchTab('crear')">Crear Boletas</button>
                    <button class="tab" onclick="switchTab('lista')">Ver Boletas</button>
                </div>
            </div>
        </header>

        <div class="wrap">
            <!-- STATS -->
            <div class="stats">
                <div class="stat">
                    <b id="stat-total">0</b>
                    <span>Total Boletas</span>
                </div>
                <div class="stat">
                    <b id="stat-general">0</b>
                    <span>General Access</span>
                </div>
                <div class="stat">
                    <b id="stat-vip">0</b>
                    <span>VIP Access</span>
                </div>
                <div class="stat">
                    <b id="stat-ventas">$0</b>
                    <span>Ventas</span>
                </div>
            </div>

            <!-- CREAR BOLETAS -->
            <div id="tab-crear">
                <div class="panel">
                    <div class="panel-head">Crear Nuevas Boletas</div>
                    <div class="panel-body">
                        <div class="grid2">
                            <div>
                                <label>Nombre:</label>
                                <input type="text" id="nombre" class="field" placeholder="Nombre completo">
                            </div>
                            <div>
                                <label>Teléfono:</label>
                                <input type="tel" id="telefono" class="field" placeholder="+57 300 0000000">
                            </div>
                        </div>
                        <div class="grid2">
                            <div>
                                <label>Tipo de Acceso:</label>
                                <select id="acceso" class="field">
                                    <option value="">Selecciona...</option>
                                    <option value="general">General Access</option>
                                    <option value="vip">VIP Access</option>
                                </select>
                            </div>
                            <div>
                                <label>Etapa:</label>
                                <select id="etapa" class="field">
                                    <option value="">Selecciona...</option>
                                    <option value="1">Etapa 1</option>
                                    <option value="2">Etapa 2</option>
                                    <option value="3">Etapa 3</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label>Cantidad:</label>
                            <input type="number" id="cantidad" class="field" placeholder="1" value="1" min="1" max="10">
                        </div>
                        <button class="btn block" onclick="crearBoletas()">Crear Boletas</button>
                        <div id="msg-crear" class="msg"></div>
                    </div>
                </div>

                <!-- RESULTADO -->
                <div id="result" class="panel hidden">
                    <div class="panel-head">
                        <span id="result-title">Boletas Creadas</span>
                    </div>
                    <div class="panel-body">
                        <div class="result-actions">
                            <button class="btn" id="dl-all">Descargar Todo</button>
                            <button class="btn ghost" id="share-all">Compartir Todo</button>
                        </div>
                        <div class="cards" id="cards"></div>
                    </div>
                </div>
            </div>

            <!-- LISTA DE BOLETAS -->
            <div id="tab-lista" class="hidden">
                <div class="panel">
                    <div class="panel-head">Historial de Boletas</div>
                    <div class="panel-body">
                        <input type="text" id="search" class="field" placeholder="Buscar por nombre o documento..." style="margin-bottom: 15px;">
                        <div class="rows" id="rows">
                            <div class="empty">Cargando boletas...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="hidden" onclick="if(event.target === this) closeModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <img id="modal-img" alt="Boleta">
            <div class="modal-actions">
                <button class="btn" id="modal-dl" onclick="downloadModal()">Descargar</button>
                <button class="btn ghost" id="modal-share" onclick="shareModal()">Compartir</button>
            </div>
        </div>
    </div>

    <script>
        // Simulación de datos
        const precios = {
            general: { 1: 25000, 2: 30000, 3: 35000 },
            vip: { 1: 35000, 2: 40000, 3: 45000 }
        };

        let boletas = [];
        let isLoggedIn = false;

        function $(id) {
            return document.getElementById(id);
        }

        // LOGIN
        function doLogin() {
            const pin = $('pin-input').value;
            if (pin === '1234') {
                isLoggedIn = true;
                $('login').classList.add('hidden');
                $('admin').classList.remove('hidden');
                updateStats();
                renderList();
            } else {
                $('msg').textContent = 'PIN incorrecto';
                $('msg').className = 'msg';
            }
        }

        function logout() {
            isLoggedIn = false;
            $('login').classList.remove('hidden');
            $('admin').classList.add('hidden');
            $('pin-input').value = '';
            $('msg').textContent = '';
        }

        // TABS
        function switchTab(tab) {
            $('tab-crear').classList.add('hidden');
            $('tab-lista').classList.add('hidden');
            $('tab-' + tab).classList.remove('hidden');
            
            document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', 'false'));
            event.target.setAttribute('aria-selected', 'true');
        }

        // CREAR BOLETAS
        function crearBoletas() {
            const nombre = $('nombre').value.trim();
            const telefono = $('telefono').value.trim();
            const acceso = $('acceso').value;
            const etapa = $('etapa').value;
            const cantidad = parseInt($('cantidad').value) || 1;

            if (!nombre || !acceso || !etapa) {
                $('msg-crear').textContent = 'Completa todos los campos';
                $('msg-crear').className = 'msg';
                return;
            }

            const precio = precios[acceso][etapa];
            const nuevasBoletas = [];

            for (let i = 1; i <= cantidad; i++) {
                nuevasBoletas.push({
                    id: Date.now() + i,
                    nombre: nombre,
                    telefono: telefono,
                    acceso: acceso,
                    etapa: etapa,
                    n: i,
                    total: cantidad,
                    precio: precio,
                    fecha: new Date().toLocaleDateString()
                });
            }

            boletas = [...boletas, ...nuevasBoletas];
            
            $('msg-crear').textContent = '✓ ' + cantidad + ' boleta(s) creada(s)';
            $('msg-crear').className = 'msg ok';

            mostrarResultado(nuevasBoletas);
            updateStats();
            renderList();

            // Limpiar formulario
            $('nombre').value = '';
            $('telefono').value = '';
            $('acceso').value = '';
            $('etapa').value = '';
            $('cantidad').value = '1';
        }

        function mostrarResultado(tickets) {
            $('result').classList.remove('hidden');
            $('result-title').textContent = tickets.length + ' boleta(s) para ' + tickets[0].nombre;
            
            const box = $('cards');
            box.innerHTML = '';

            tickets.forEach(ticket => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const qr = document.createElement('div');
                qr.style.width = '100%';
                qr.style.height = '180px';
                qr.style.background = 'linear-gradient(45deg, #E63946, #F4D03F)';
                qr.style.display = 'flex';
                qr.style.alignItems = 'center';
                qr.style.justifyContent = 'center';
                qr.style.color = '#1a1a1a';
                qr.style.fontSize = '0.7rem';
                qr.style.fontWeight = 'bold';
                qr.textContent = 'QR ' + ticket.id;

                const actions = document.createElement('div');
                actions.className = 'card-actions';
                actions.innerHTML = `
                    <button class="btn sm" onclick="downloadTicket(${ticket.id})">Descargar</button>
                    <button class="btn sm ghost" onclick="shareTicket(${ticket.id})">Compartir</button>
                `;

                card.appendChild(qr);
                card.appendChild(actions);
                box.appendChild(card);
            });

            $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // LISTA
        function renderList() {
            const box = $('rows');
            const search = $('search').value.toLowerCase();

            const filtradas = boletas.filter(b => 
                b.nombre.toLowerCase().includes(search) || 
                b.telefono.includes(search)
            );

            if (!filtradas.length) {
                box.innerHTML = '<div class="empty">No hay boletas</div>';
                return;
            }

            box.innerHTML = '';
            filtradas.forEach(boleta => {
                const row = document.createElement('div');
                row.className = 'row';
                
                row.innerHTML = `
                    <div>
                        <div class="row-name">
                            <span class="pill ${boleta.acceso}">${boleta.acceso.toUpperCase()}</span>
                            ${boleta.nombre}
                        </div>
                        <div class="row-meta">Boleta ${boleta.n} de ${boleta.total} · Etapa ${boleta.etapa} · $${boleta.precio.toLocaleString()}</div>
                    </div>
                    <div style="display: flex; gap: 6px;">
                        <button class="btn sm" onclick="openModal(${boleta.id})">Ver</button>
                        <button class="btn sm ghost" onclick="deleteBoleta(${boleta.id})">Anular</button>
                    </div>
                `;

                box.appendChild(row);
            });
        }

        // MODAL
        function openModal(id) {
            const boleta = boletas.find(b => b.id === id);
            if (!boleta) return;

            $('modal').classList.remove('hidden');
            $('modal-img').style.background = 'linear-gradient(45deg, #E63946, #F4D03F)';
            $('modal-img').style.height = '500px';
            $('modal-img').textContent = 'Boleta QR: ' + boleta.id;
            $('modal-img').style.display = 'flex';
            $('modal-img').style.alignItems = 'center';
            $('modal-img').style.justifyContent = 'center';
            $('modal-img').style.color = '#1a1a1a';
            $('modal-img').style.fontSize = '1.2rem';
        }

        function closeModal() {
            $('modal').classList.add('hidden');
        }

        // ACCIONES
        function downloadTicket(id) {
            alert('Descargando boleta ' + id);
        }

        function shareTicket(id) {
            const boleta = boletas.find(b => b.id === id);
            if (boleta && boleta.telefono) {
                const msg = `Hola ${boleta.nombre}, aquí tienes tu boleta para Sin City Fest Halloween Edition`;
                const wa = `https://wa.me/${boleta.telefono}?text=${encodeURIComponent(msg)}`;
                window.open(wa, '_blank');
            }
        }

        function downloadModal() {
            alert('Descargando desde modal');
        }

        function shareModal() {
            alert('Compartiendo desde modal');
        }

        function deleteBoleta(id) {
            if (confirm('¿Anular esta boleta?')) {
                boletas = boletas.filter(b => b.id !== id);
                updateStats();
                renderList();
            }
        }

        // STATS
        function updateStats() {
            const total = boletas.length;
            const general = boletas.filter(b => b.acceso === 'general').length;
            const vip = boletas.filter(b => b.acceso === 'vip').length;
            const ventas = boletas.reduce((sum, b) => sum + b.precio, 0);

            $('stat-total').textContent = total;
            $('stat-general').textContent = general;
            $('stat-vip').textContent = vip;
            $('stat-ventas').textContent = '$' + ventas.toLocaleString();
        }

        // EVENT LISTENERS
        $('pin-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });

        $('search').addEventListener('input', renderList);

        // Inicializar
        $('login').classList.remove('hidden');
        $('admin').classList.add('hidden');
    </script>
</body>
</html>
