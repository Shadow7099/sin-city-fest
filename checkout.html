 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar Boletas - Sin City Fest 2026</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-red: #E63946;
            --color-yellow: #F4D03F;
            --color-black: #1A1A1A;
            --color-cream: #E8DCC0;
        }

        @font-face {
            font-family: 'Barbra-Regular';
            src: url('https://tpdormyzwodptmtdksrs.supabase.co/storage/v1/object/sign/sin%20city%20fest/Barbra-Regular.otf?token=eyJraWQiOiI1NmY5Y2NkOC02ZDdlLTQ5YTQtYmRhMC1mZTVjY2I1Yzg1YjMiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJzaW4gY2l0eSBmZXN0L0JhcmJyYS1SZWd1bGFyLm90ZiIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3OTEwNDQ2OTYsImV4cCI6MTgyMjU4MDY5Nn0.jR0luJ2XcTGUXLwEe0I-nCTx4UDVcvoBAenS9bLZopnGTA0UCSFyDQ6XnDcQZsc2poGRZqwVQVD2CBebW1w99g') format('opentype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'LexieReadable-Bold';
            src: url('https://tpdormyzwodptmtdksrs.supabase.co/storage/v1/object/sign/sin%20city%20fest/LexieReadable-Bold.ttf?token=eyJraWQiOiI1NmY5Y2NkOC02ZDdlLTQ5YTQtYmRhMC1mZTVjY2I1Yzg1YjMiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJzaW4gY2l0eSBmZXN0L0xleGllUmVhZGFibGUtQm9sZC50dGYiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzkxMDQ0NzEzLCJleHAiOjE4MjI1ODA3MTN9.ffDyupRpB1FlCCxas35agP6dI0YAvDZ-GPfE5c500mbbKJQZ-aqFZld0dueF1UOZoc60GL3uAPhGna-uxB96xQ') format('truetype');
            font-weight: 700;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: var(--color-red);
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* MARCO ESTILO LANDING */
        .poster-frame {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 12px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
        }

        .poster-frame::before {
            content: '✕';
            position: absolute;
            top: 8px;
            left: 20px;
            font-size: 1.5rem;
            color: var(--color-black);
            font-weight: bold;
            z-index: 10;
        }

        .poster-frame::after {
            content: '✕';
            position: absolute;
            top: 8px;
            right: 20px;
            font-size: 1.5rem;
            color: var(--color-black);
            font-weight: bold;
            z-index: 10;
        }

        .checkout-container {
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            padding: 50px 45px;
            position: relative;
            border: 2px solid var(--color-black);
            overflow: hidden;
        }

        .checkout-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" /></filter><rect width="256" height="256" fill="%23000000" opacity="0.08" filter="url(%23noise)"/></svg>');
            background-size: 256px 256px;
            animation: grain 8s steps(10) infinite;
            z-index: 0;
            pointer-events: none;
        }

        .checkout-content {
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--color-cream);
            padding-bottom: 20px;
        }

        .header h1 {
            font-family: 'Barbra-Regular', serif;
            font-size: 3.5rem;
            color: var(--color-cream);
            text-shadow: 3px 3px 0 var(--color-black);
            margin-bottom: 10px;
        }

        .header p {
            color: var(--color-yellow);
            font-size: 1.1rem;
            text-shadow: 2px 2px 0 var(--color-black);
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 12px 30px;
            background: var(--color-yellow);
            color: var(--color-red);
            text-decoration: none;
            font-family: 'Barbra-Regular', serif;
            font-weight: bold;
            font-size: 1rem;
            border: 2px solid var(--color-black);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 3px 3px 0 var(--color-black);
        }

        .back-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--color-black);
        }

        .form-section {
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--color-cream);
        }

        .form-section h2 {
            font-family: 'LexieReadable-Bold', sans-serif;
            font-size: 1.4rem;
            color: var(--color-yellow);
            text-shadow: 2px 2px 0 var(--color-black);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group.full {
            grid-template-columns: 1fr;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--color-cream);
            background: rgba(0, 0, 0, 0.5);
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
            font-size: 1rem;
            border-radius: 0;
        }

        input::placeholder {
            color: rgba(232, 220, 192, 0.5);
        }

        select option {
            background: var(--color-black);
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--color-yellow);
            box-shadow: 0 0 10px rgba(244, 208, 63, 0.5);
        }

        .price-summary {
            background: var(--color-red);
            padding: 20px;
            margin-bottom: 30px;
            border: 3px solid white;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
        }

        .price-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-family: 'Barbra-Regular', serif;
            font-weight: bold;
            border-top: 2px solid white;
            padding-top: 10px;
            margin-top: 10px;
            color: var(--color-yellow);
            text-shadow: 2px 2px 0 var(--color-black);
        }

        .checkout-button {
            width: 100%;
            padding: 15px;
            background: var(--color-yellow);
            color: var(--color-red);
            border: 3px solid var(--color-black);
            font-family: 'Barbra-Regular', serif;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0 var(--color-black);
        }

        .checkout-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--color-black);
        }

        .checkout-button:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }

        #bold-checkout {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed var(--color-cream);
        }

        @keyframes grain {
            0% { background-position: 0 0; }
            100% { background-position: 256px 256px; }
        }

        @media (max-width: 768px) {
            .form-group {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2.5rem;
            }

            .checkout-container {
                padding: 25px;
            }
        }

        /* ---- Añadidos para el flujo de pago (misma estética) ---- */
        select:disabled, input:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .stage-hint {
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--color-yellow);
            letter-spacing: 1px;
        }

        .bold-note {
            color: var(--color-yellow);
            text-shadow: 2px 2px 0 var(--color-black);
            font-size: 1.05rem;
            text-align: center;
            margin-bottom: 20px;
        }

        #bold-slot {
            display: flex;
            justify-content: center;
            min-height: 64px;
            margin: 10px 0 25px;
        }

        .edit-wrap {
            text-align: center;
        }

        .edit-wrap .back-button {
            margin-bottom: 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="poster-frame">
        <div class="checkout-container">
            <div class="checkout-content">
                <a href="index.html" class="back-button">← Volver</a>

                <div class="header">
                    <h1>COMPRAR BOLETAS</h1>
                    <p>Sin City Fest - Halloween Edition</p>
                </div>

        <div class="form-section">
            <h2>Selecciona tu Boleta</h2>
            
            <div class="form-group">
                <div>
                    <label for="ticket-type">Tipo de Acceso:</label>
                    <select id="ticket-type" onchange="calcularPrecio()">
                        <option value="">Selecciona un tipo...</option>
                        <option value="general">General Access</option>
                        <option value="vip">VIP Access</option>
                    </select>
                </div>

                <div>
                    <label for="ticket-stage">Etapa de Venta:</label>
                    <select id="ticket-stage" onchange="calcularPrecio()">
                        <option value="">Selecciona etapa...</option>
                        <option value="1">Etapa 1</option>
                        <option value="2">Etapa 2</option>
                        <option value="3">Etapa 3</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div>
                    <label for="quantity">Cantidad de Boletas:</label>
                    <input type="number" id="quantity" value="1" min="1" max="10" onchange="calcularPrecio()" oninput="calcularPrecio()">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2>Datos Personales</h2>
            
            <div class="form-group">
                <div>
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" placeholder="Tu nombre" required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <div>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" placeholder="+57 300 0000000" required>
                </div>

                <div>
                    <label for="documento">Documento (CC/Pasaporte):</label>
                    <input type="text" id="documento" placeholder="1234567890" required>
                </div>
            </div>
        </div>

        <div class="price-summary">
            <div class="price-item">
                <span>Precio Unitario:</span>
                <span id="unit-price">$0</span>
            </div>
            <div class="price-item">
                <span>Cantidad:</span>
                <span id="qty-display">1</span>
            </div>
            <div class="price-total">
                <span>TOTAL:</span>
                <span id="total-price">$0</span>
            </div>
        </div>

        <button class="checkout-button" id="pay-btn" type="button" onclick="procesarPago()">Proceder al Pago con Bold</button>

                <div id="bold-checkout"></div>
            </div>
        </div>
    </div>

    <script>
        // ===== Configuración =====
        const SUPABASE_URL = "https://tpdormyzwodptmtdksrs.supabase.co";
        const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZG9ybXl6d29kcHRtdGRrc3JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzU4MjYsImV4cCI6MjEwNjYxMTgyNn0.elK5v13Ufz1ogpykGnE0713OuMha6f03djTnIgYJ7iY";
        const FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";

        // Solo para MOSTRAR el precio. El cobro real lo calcula el servidor (create-order).
        const precios = {
            general: { 1: 25000, 2: 30000, 3: 35000 },
            vip: { 1: 35000, 2: 40000, 3: 45000 }
        };

        function $(id) { return document.getElementById(id); }

        function calcularPrecio() {
            const type = $('ticket-type').value;
            const stage = $('ticket-stage').value;
            let quantity = parseInt($('quantity').value) || 1;
            if (quantity < 1) quantity = 1;
            if (quantity > 10) quantity = 10;

            let unitPrice = 0;
            if (type && stage && precios[type] && precios[type][stage]) {
                unitPrice = precios[type][stage];
            }

            const total = unitPrice * quantity;

            $('unit-price').textContent = '$' + unitPrice.toLocaleString('es-CO');
            $('qty-display').textContent = quantity;
            $('total-price').textContent = '$' + total.toLocaleString('es-CO');
        }

        // La etapa vigente la define el servidor (tabla sale_stage): se muestra y se bloquea.
        fetch(SUPABASE_URL + "/rest/v1/sale_stage?select=current_stage&limit=1", {
            headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY }
        })
        .then(r => r.json())
        .then(rows => {
            if (rows && rows[0] && rows[0].current_stage) {
                const n = String(rows[0].current_stage).replace(/\D/g, '');
                const sel = $('ticket-stage');
                sel.value = n;
                sel.disabled = true;
                const hint = document.createElement('div');
                hint.className = 'stage-hint';
                hint.textContent = 'Etapa vigente de venta';
                sel.parentNode.appendChild(hint);
                calcularPrecio();
            }
        })
        .catch(() => { /* si falla, el usuario ve el precio de la etapa elegida; el servidor cobra el correcto */ });

        // ===== Bloqueo del formulario mientras se paga =====
        const CAMPOS = ['ticket-type', 'ticket-stage', 'quantity', 'nombre', 'email', 'telefono', 'documento'];
        let etapaBloqueadaPorServidor = false;

        function bloquearFormulario(bloquear) {
            CAMPOS.forEach(id => {
                const el = $(id);
                if (!el) return;
                if (id === 'ticket-stage') {
                    if (bloquear) { etapaBloqueadaPorServidor = el.disabled; el.disabled = true; }
                    else { el.disabled = etapaBloqueadaPorServidor; }
                } else {
                    el.disabled = bloquear;
                }
            });
            $('pay-btn').style.display = bloquear ? 'none' : 'block';
            if (!bloquear) $('bold-checkout').innerHTML = '';
        }

        // ===== Botón de Bold =====
        function montarBotonBold(d, comprador) {
            const cont = $('bold-checkout');
            cont.innerHTML = '';

            const nota = document.createElement('p');
            nota.className = 'bold-note';
            nota.textContent = 'Tu orden está lista. Toca el botón de Bold para pagar.';
            cont.appendChild(nota);

            const slot = document.createElement('div');
            slot.id = 'bold-slot';
            cont.appendChild(slot);

            const s = document.createElement('script');
            s.setAttribute('data-bold-button', 'dark-L');
            s.setAttribute('data-order-id', d.order_id);
            s.setAttribute('data-currency', d.currency);
            s.setAttribute('data-amount', String(d.amount));
            s.setAttribute('data-api-key', d.api_key);
            s.setAttribute('data-integrity-signature', d.integrity_signature);
            s.setAttribute('data-redirection-url', d.redirection_url);
            s.setAttribute('data-description', d.description || 'Sin City Fest');

            const cliente = {
                email: comprador.email,
                fullName: comprador.nombre,
                phone: comprador.telefono.replace(/\D/g, '').replace(/^57(?=\d{10}$)/, ''),
                dialCode: '+57'
            };
            if (/^\d{5,}$/.test(comprador.documento)) {
                cliente.documentNumber = comprador.documento;
                cliente.documentType = 'CC';
            }
            s.setAttribute('data-customer-data', JSON.stringify(cliente));
            slot.appendChild(s);

            // La librería de Bold debe cargarse DESPUÉS de que el botón configurado esté en el DOM.
            const vieja = $('bold-lib-script');
            if (vieja) vieja.remove();
            const lib = document.createElement('script');
            lib.id = 'bold-lib-script';
            lib.src = 'https://checkout.bold.co/library/boldPaymentButton.js';
            document.body.appendChild(lib);

            const wrap = document.createElement('div');
            wrap.className = 'edit-wrap';
            const edit = document.createElement('button');
            edit.type = 'button';
            edit.className = 'back-button';
            edit.textContent = 'Cambiar datos o cantidad';
            edit.addEventListener('click', () => bloquearFormulario(false));
            wrap.appendChild(edit);
            cont.appendChild(wrap);

            cont.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ===== Crear la orden y mostrar el pago =====
        function procesarPago() {
            const comprador = {
                tipo: $('ticket-type').value,
                cantidad: parseInt($('quantity').value),
                nombre: $('nombre').value.trim(),
                email: $('email').value.trim(),
                telefono: $('telefono').value.trim(),
                documento: $('documento').value.trim()
            };

            if (!comprador.tipo || !comprador.nombre || !comprador.email || !comprador.telefono || !comprador.cantidad) {
                alert('Por favor completa todos los campos');
                return;
            }
            if (!/^\S+@\S+\.\S+$/.test(comprador.email)) {
                alert('Escribe un correo válido');
                return;
            }
            if (comprador.telefono.replace(/\D/g, '').length < 7) {
                alert('Escribe un teléfono válido');
                return;
            }
            if (comprador.cantidad < 1 || comprador.cantidad > 10) {
                alert('La cantidad debe estar entre 1 y 10');
                return;
            }

            const btn = $('pay-btn');
            btn.disabled = true;
            btn.textContent = 'Procesando...';

            // El servidor decide la etapa y el precio: solo enviamos tipo, cantidad y datos.
            fetch(FUNCTIONS_BASE + "/create-order", {
                method: "POST",
                headers: { "Content-Type": "application/json", apikey: ANON_KEY },
                body: JSON.stringify({
                    full_name: comprador.nombre,
                    email: comprador.email,
                    phone: comprador.telefono,
                    access_type: comprador.tipo,
                    quantity: comprador.cantidad
                })
            })
            .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
            .then(res => {
                if (!res.ok || !res.data || !res.data.integrity_signature) {
                    throw new Error((res.data && res.data.error) || 'Error creando orden');
                }
                const orderData = res.data;

                // Guardar la orden para poder recuperar las boletas si se cierra la pestaña
                try {
                    const orders = JSON.parse(localStorage.getItem("sincity_orders") || "[]");
                    orders.unshift({ id: orderData.order_id, name: comprador.nombre, at: Date.now(), amount: orderData.amount });
                    localStorage.setItem("sincity_orders", JSON.stringify(orders.slice(0, 10)));
                    localStorage.setItem("sincity_last_order", orderData.order_id);
                } catch (e) {}

                btn.disabled = false;
                btn.textContent = 'Proceder al Pago con Bold';
                bloquearFormulario(true);
                montarBotonBold(orderData, comprador);
            })
            .catch(err => {
                btn.disabled = false;
                btn.textContent = 'Proceder al Pago con Bold';
                alert('Error: ' + (err.message || 'No se pudo procesar el pago'));
                console.error('Payment error:', err);
            });
        }

        // Inicializar precios
        calcularPrecio();
    </script>
</body>
</html>
