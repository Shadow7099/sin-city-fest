<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar Boletas - Sin City Fest 2026</title>
    
    <!-- Bold Checkout Script -->
    <script src="https://checkout.bold.co/library/boldPaymentButton.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-red: #E63946;
            --color-yellow: #F4D03F;
            --color-black: #1A1A1A;
            --color-cream: #E8DCC0;
        }

        @font-face {
            font-family: 'Barbra-Regular';
            src: url('https://tpdormyzwodptmtdksrs.supabase.co/storage/v1/object/sign/sin%20city%20fest/Barbra-Regular.otf?token=eyJraWQiOiI1NmY5Y2NkOC02ZDdlLTQ5YTQtYmRhMC1mZTVjY2I1Yzg1YjMiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJzaW4gY2l0eSBmZXN0L0JhcmJyYS1SZWd1bGFyLm90ZiIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3OTEwNDQ2OTYsImV4cCI6MTgyMjU4MDY5Nn0.jR0luJ2XcTGUXLwEe0I-nCTx4UDVcvoBAenS9bLZopnGTA0UCSFyDQ6XnDcQZsc2poGRZqwVQVD2CBebW1w99g') format('opentype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'LexieReadable-Bold';
            src: url('https://tpdormyzwodptmtdksrs.supabase.co/storage/v1/object/sign/sin%20city%20fest/LexieReadable-Bold.ttf?token=eyJraWQiOiI1NmY5Y2NkOC02ZDdlLTQ5YTQtYmRhMC1mZTVjY2I1Yzg1YjMiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJzaW4gY2l0eSBmZXN0L0xleGllUmVhZGFibGUtQm9sZC50dGYiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzkxMDQ0NzEzLCJleHAiOjE4MjI1ODA3MTN9.ffDyupRpB1FlCCxas35agP6dI0YAvDZ-GPfE5c500mbbKJQZ-aqFZld0dueF1UOZoc60GL3uAPhGna-uxB96xQ') format('truetype');
            font-weight: 700;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: var(--color-red);
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* MARCO ESTILO LANDING */
        .poster-frame {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 12px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
        }

        .poster-frame::before {
            content: '✕';
            position: absolute;
            top: 8px;
            left: 20px;
            font-size: 1.5rem;
            color: var(--color-black);
            font-weight: bold;
            z-index: 10;
        }

        .poster-frame::after {
            content: '✕';
            position: absolute;
            top: 8px;
            right: 20px;
            font-size: 1.5rem;
            color: var(--color-black);
            font-weight: bold;
            z-index: 10;
        }

        .checkout-container {
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            padding: 50px 45px;
            position: relative;
            border: 2px solid var(--color-black);
            overflow: hidden;
        }

        .checkout-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" /></filter><rect width="256" height="256" fill="%23000000" opacity="0.08" filter="url(%23noise)"/></svg>');
            background-size: 256px 256px;
            animation: grain 8s steps(10) infinite;
            z-index: 0;
            pointer-events: none;
        }

        .checkout-content {
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--color-cream);
            padding-bottom: 20px;
        }

        .header h1 {
            font-family: 'Barbra-Regular', serif;
            font-size: 3.5rem;
            color: var(--color-cream);
            text-shadow: 3px 3px 0 var(--color-black);
            margin-bottom: 10px;
        }

        .header p {
            color: var(--color-yellow);
            font-size: 1.1rem;
            text-shadow: 2px 2px 0 var(--color-black);
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 12px 30px;
            background: var(--color-yellow);
            color: var(--color-red);
            text-decoration: none;
            font-family: 'Barbra-Regular', serif;
            font-weight: bold;
            font-size: 1rem;
            border: 2px solid var(--color-black);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 3px 3px 0 var(--color-black);
        }

        .back-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--color-black);
        }

        .form-section {
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--color-cream);
        }

        .form-section h2 {
            font-family: 'LexieReadable-Bold', sans-serif;
            font-size: 1.4rem;
            color: var(--color-yellow);
            text-shadow: 2px 2px 0 var(--color-black);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group.full {
            grid-template-columns: 1fr;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--color-cream);
            background: rgba(0, 0, 0, 0.5);
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
            font-size: 1rem;
            border-radius: 0;
        }

        input::placeholder {
            color: rgba(232, 220, 192, 0.5);
        }

        select option {
            background: var(--color-black);
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--color-yellow);
            box-shadow: 0 0 10px rgba(244, 208, 63, 0.5);
        }

        .price-summary {
            background: var(--color-red);
            padding: 20px;
            margin-bottom: 30px;
            border: 3px solid white;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
        }

        .price-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-family: 'Barbra-Regular', serif;
            font-weight: bold;
            border-top: 2px solid white;
            padding-top: 10px;
            margin-top: 10px;
            color: var(--color-yellow);
            text-shadow: 2px 2px 0 var(--color-black);
        }

        .checkout-button {
            width: 100%;
            padding: 15px;
            background: var(--color-yellow);
            color: var(--color-red);
            border: 3px solid var(--color-black);
            font-family: 'Barbra-Regular', serif;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0 var(--color-black);
        }

        .checkout-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--color-black);
        }

        .checkout-button:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }

        #bold-checkout {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed var(--color-cream);
        }

        @keyframes grain {
            0% { background-position: 0 0; }
            100% { background-position: 256px 256px; }
        }

        @media (max-width: 768px) {
            .form-group {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2.5rem;
            }

            .checkout-container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="poster-frame">
        <div class="checkout-container">
            <div class="checkout-content">
                <a href="index.html" class="back-button">← Volver</a>

                <div class="header">
                    <h1>COMPRAR BOLETAS</h1>
                    <p>Sin City Fest - Halloween Edition</p>
                </div>

        <div class="form-section">
            <h2>Selecciona tu Boleta</h2>
            
            <div class="form-group">
                <div>
                    <label for="ticket-type">Tipo de Acceso:</label>
                    <select id="ticket-type" onchange="calcularPrecio()">
                        <option value="">Selecciona un tipo...</option>
                        <option value="general">General Access</option>
                        <option value="vip">VIP Access</option>
                    </select>
                </div>

                <div>
                    <label for="ticket-stage">Etapa de Venta:</label>
                    <select id="ticket-stage" onchange="calcularPrecio()">
                        <option value="">Selecciona etapa...</option>
                        <option value="1">Etapa 1</option>
                        <option value="2">Etapa 2</option>
                        <option value="3">Etapa 3</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div>
                    <label for="quantity">Cantidad de Boletas:</label>
                    <input type="number" id="quantity" value="1" min="1" max="10" onchange="calcularPrecio()">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2>Datos Personales</h2>
            
            <div class="form-group">
                <div>
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" placeholder="Tu nombre" required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <div>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" placeholder="+57 300 0000000" required>
                </div>

                <div>
                    <label for="documento">Documento (CC/Pasaporte):</label>
                    <input type="text" id="documento" placeholder="1234567890" required>
                </div>
            </div>
        </div>

        <div class="price-summary">
            <div class="price-item">
                <span>Precio Unitario:</span>
                <span id="unit-price">$0</span>
            </div>
            <div class="price-item">
                <span>Cantidad:</span>
                <span id="qty-display">1</span>
            </div>
            <div class="price-total">
                <span>TOTAL:</span>
                <span id="total-price">$0</span>
            </div>
        </div>

        <button class="checkout-button" onclick="procesarPago()">Proceder al Pago con Bold</button>

                <div id="bold-checkout"></div>
            </div>
        </div>
    </div>

    <script>
        const precios = {
            general: { 1: 25000, 2: 30000, 3: 35000 },
            vip: { 1: 35000, 2: 40000, 3: 45000 }
        };

        function calcularPrecio() {
            const type = document.getElementById('ticket-type').value;
            const stage = document.getElementById('ticket-stage').value;
            const quantity = parseInt(document.getElementById('quantity').value) || 1;

            let unitPrice = 0;
            if (type && stage && precios[type][stage]) {
                unitPrice = precios[type][stage];
            }

            const total = unitPrice * quantity;

            document.getElementById('unit-price').textContent = '$' + unitPrice.toLocaleString();
            document.getElementById('qty-display').textContent = quantity;
            document.getElementById('total-price').textContent = '$' + total.toLocaleString();
        }

        const FUNCTIONS_BASE = "https://tpdormyzwodptmtdksrs.supabase.co/functions/v1";

        function procesarPago() {
            const tipo = document.getElementById('ticket-type').value;
            const etapa = document.getElementById('ticket-stage').value;
            const cantidad = parseInt(document.getElementById('quantity').value);
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const telefono = document.getElementById('telefono').value;

            // Validar campos
            if (!tipo || !etapa || !nombre || !email || !telefono || !cantidad) {
                alert('Por favor completa todos los campos');
                return;
            }

            const total = (precios[tipo][etapa] * cantidad);

            // Deshabilitar botón mientras se procesa
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Procesando...';

            // Llamar a Edge Function /create-order
            fetch(FUNCTIONS_BASE + "/create-order", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    full_name: nombre,
                    email: email,
                    phone: telefono,
                    access_type: tipo === 'vip' ? 'vip' : 'general',
                    stage: etapa,
                    quantity: cantidad
                })
            })
            .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
            .then(res => {
                if (!res.ok) {
                    throw new Error(res.data?.error || 'Error creando orden');
                }

                const orderData = res.data;
                
                // Guardar orden en localStorage
                var orders = JSON.parse(localStorage.getItem("sincity_orders") || "[]");
                orders.unshift({ 
                    id: orderData.order_id, 
                    name: nombre, 
                    at: Date.now(),
                    amount: orderData.amount
                });
                localStorage.setItem("sincity_orders", JSON.stringify(orders.slice(0, 10)));

                // Esperar a que Bold cargue
                return new Promise((resolve, reject) => {
                    var tries = 0;
                    var t = setInterval(() => {
                        if (window.BoldCheckout) { 
                            clearInterval(t); 
                            resolve(orderData); 
                        } else if (++tries > 50) { 
                            clearInterval(t); 
                            reject(new Error("Bold no cargó. Recarga la página e intenta de nuevo.")); 
                        }
                    }, 100);
                });
            })
            .then(orderData => {
                // Iniciar Bold Checkout
                window.boldPaymentButton({
                    orderId: orderData.order_id,
                    currency: orderData.currency,
                    amount: String(orderData.amount),
                    ident: orderData.ident,
                    description: orderData.description,
                    redirectionUrl: orderData.redirection_url,
                    customerEmail: email,
                    customerName: nombre,
                    customerPhone: telefono.replace(/\D/g, ""),
                });
            })
            .catch(err => {
                btn.disabled = false;
                btn.textContent = 'Pagar con Bold';
                alert('Error: ' + (err.message || 'No se pudo procesar el pago'));
                console.error('Payment error:', err);
            });
        }

        // Inicializar precios
        calcularPrecio();
    </script>
</body>
</html>
