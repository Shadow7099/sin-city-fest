<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tus Boletas - Sin City Fest 2026</title>
    <meta name="robots" content="noindex">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-red: #E63946;
            --color-yellow: #F4D03F;
            --color-black: #1A1A1A;
            --color-cream: #E8DCC0;
        }

        @font-face {
            font-family: 'Barbra-Regular';
            src: url('https://tpdormyzwodptmtdksrs.supabase.co/storage/v1/object/sign/sin%20city%20fest/Barbra-Regular.otf?token=eyJraWQiOiI1NmY5Y2NkOC02ZDdlLTQ5YTQtYmRhMC1mZTVjY2I1Yzg1YjMiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJzaW4gY2l0eSBmZXN0L0JhcmJyYS1SZWd1bGFyLm90ZiIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3OTEwNDQ2OTYsImV4cCI6MTgyMjU4MDY5Nn0.jR0luJ2XcTGUXLwEe0I-nCTx4UDVcvoBAenS9bLZopnGTA0UCSFyDQ6XnDcQZsc2poGRZqwVQVD2CBebW1w99g') format('opentype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'LexieReadable-Bold';
            src: url('https://tpdormyzwodptmtdksrs.supabase.co/storage/v1/object/sign/sin%20city%20fest/LexieReadable-Bold.ttf?token=eyJraWQiOiI1NmY5Y2NkOC02ZDdlLTQ5YTQtYmRhMC1mZTVjY2I1Yzg1YjMiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJzaW4gY2l0eSBmZXN0L0xleGllUmVhZGFibGUtQm9sZC50dGYiLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzkxMDQ0NzEzLCJleHAiOjE4MjI1ODA3MTN9.ffDyupRpB1FlCCxas35agP6dI0YAvDZ-GPfE5c500mbbKJQZ-aqFZld0dueF1UOZoc60GL3uAPhGna-uxB96xQ') format('truetype');
            font-weight: 700;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: var(--color-red);
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* MARCO ESTILO LANDING */
        .poster-frame {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 12px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
        }

        .poster-frame::before {
            content: '✕';
            position: absolute;
            top: 8px;
            left: 20px;
            font-size: 1.5rem;
            color: var(--color-black);
            font-weight: bold;
            z-index: 10;
        }

        .poster-frame::after {
            content: '✕';
            position: absolute;
            top: 8px;
            right: 20px;
            font-size: 1.5rem;
            color: var(--color-black);
            font-weight: bold;
            z-index: 10;
        }

        .checkout-container {
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            padding: 50px 45px;
            position: relative;
            border: 2px solid var(--color-black);
            overflow: hidden;
        }

        .checkout-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" /></filter><rect width="256" height="256" fill="%23000000" opacity="0.08" filter="url(%23noise)"/></svg>');
            background-size: 256px 256px;
            animation: grain 8s steps(10) infinite;
            z-index: 0;
            pointer-events: none;
        }

        .checkout-content {
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--color-cream);
            padding-bottom: 20px;
        }

        .header h1 {
            font-family: 'Barbra-Regular', serif;
            font-size: 3.5rem;
            color: var(--color-cream);
            text-shadow: 3px 3px 0 var(--color-black);
            margin-bottom: 10px;
        }

        .header p {
            color: var(--color-yellow);
            font-size: 1.1rem;
            text-shadow: 2px 2px 0 var(--color-black);
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 12px 30px;
            background: var(--color-yellow);
            color: var(--color-red);
            text-decoration: none;
            font-family: 'Barbra-Regular', serif;
            font-weight: bold;
            font-size: 1rem;
            border: 2px solid var(--color-black);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 3px 3px 0 var(--color-black);
        }

        .back-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--color-black);
        }

        .form-section {
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--color-cream);
        }

        .form-section h2 {
            font-family: 'LexieReadable-Bold', sans-serif;
            font-size: 1.4rem;
            color: var(--color-yellow);
            text-shadow: 2px 2px 0 var(--color-black);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group.full {
            grid-template-columns: 1fr;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--color-cream);
            background: rgba(0, 0, 0, 0.5);
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
            font-size: 1rem;
            border-radius: 0;
        }

        input::placeholder {
            color: rgba(232, 220, 192, 0.5);
        }

        select option {
            background: var(--color-black);
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--color-yellow);
            box-shadow: 0 0 10px rgba(244, 208, 63, 0.5);
        }

        .price-summary {
            background: var(--color-red);
            padding: 20px;
            margin-bottom: 30px;
            border: 3px solid white;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: var(--color-cream);
            font-family: 'LexieReadable-Bold', sans-serif;
        }

        .price-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-family: 'Barbra-Regular', serif;
            font-weight: bold;
            border-top: 2px solid white;
            padding-top: 10px;
            margin-top: 10px;
            color: var(--color-yellow);
            text-shadow: 2px 2px 0 var(--color-black);
        }

        .checkout-button {
            width: 100%;
            padding: 15px;
            background: var(--color-yellow);
            color: var(--color-red);
            border: 3px solid var(--color-black);
            font-family: 'Barbra-Regular', serif;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0 var(--color-black);
        }

        .checkout-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--color-black);
        }

        .checkout-button:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }

        #bold-checkout {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed var(--color-cream);
        }

        @keyframes grain {
            0% { background-position: 0 0; }
            100% { background-position: 256px 256px; }
        }

        @media (max-width: 768px) {
            .form-group {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2.5rem;
            }

            .checkout-container {
                padding: 25px;
            }
        }
    
        /* ---- Confirmación: misma estética que el checkout ---- */
        .status-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .status-box p {
            color: var(--color-cream);
            font-size: 1.05rem;
            margin-bottom: 14px;
        }

        .spinner {
            width: 46px;
            height: 46px;
            margin: 10px auto 20px;
            border: 5px solid rgba(232, 220, 192, 0.25);
            border-top-color: var(--color-yellow);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .price-summary .price-item span:last-child {
            text-align: right;
            word-break: break-word;
            max-width: 65%;
        }

        .ticket {
            background: var(--color-cream);
            color: var(--color-black);
            border: 3px solid var(--color-black);
            box-shadow: 5px 5px 0 var(--color-black);
            padding: 22px 18px;
            margin: 0 auto 28px;
            max-width: 380px;
            text-align: center;
            position: relative;
        }

        .ticket::before, .ticket::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 22px;
            height: 22px;
            background: #141414;
            border: 3px solid var(--color-black);
            border-radius: 50%;
            transform: translateY(-50%);
        }
        .ticket::before { left: -14px; }
        .ticket::after { right: -14px; }

        .ticket h3 {
            font-family: 'Barbra-Regular', serif;
            font-size: 1.5rem;
            color: var(--color-red);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .ticket .who {
            font-size: 0.95rem;
            margin-bottom: 14px;
            letter-spacing: 1px;
            word-break: break-word;
        }

        .qr-box {
            background: #fff;
            display: inline-block;
            padding: 12px;
            border: 2px solid var(--color-black);
            min-height: 200px;
            min-width: 200px;
        }

        .qr-box canvas, .qr-box img { display: block; max-width: 100%; height: auto; }

        .ticket .token {
            margin-top: 12px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.7rem;
            word-break: break-all;
            opacity: 0.7;
        }

        .ticket .checkout-button {
            margin-top: 16px;
            padding: 11px;
            font-size: 1rem;
        }

        .hint {
            text-align: center;
            color: var(--color-yellow);
            text-shadow: 2px 2px 0 var(--color-black);
            font-size: 0.95rem;
            margin-top: 10px;
        }

        .actions { text-align: center; margin-top: 10px; }
        .actions .back-button { margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="poster-frame">
        <div class="checkout-container">
            <div class="checkout-content">
                <a href="index.html" class="back-button">← Volver</a>

                <div class="header">
                    <h1 id="titulo">VERIFICANDO PAGO</h1>
                    <p id="subtitulo">Sin City Fest - Halloween Edition</p>
                </div>

                <div class="status-box" id="estado">
                    <div class="spinner"></div>
                    <p>Estamos verificando tu pago…</p>
                </div>

                <div class="price-summary" id="resumen" style="display:none"></div>

                <div id="boletas"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const SUPABASE_URL = "https://tpdormyzwodptmtdksrs.supabase.co";
        const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZG9ybXl6d29kcHRtdGRrc3JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzU4MjYsImV4cCI6MjEwNjYxMTgyNn0.elK5v13Ufz1ogpykGnE0713OuMha6f03djTnIgYJ7iY";
        const ENDPOINT = SUPABASE_URL + "/functions/v1/get-tickets";
        const POLL_MS = 3000;
        const MAX_POLLS = 60; // ~3 minutos esperando el webhook de Bold

        const params = new URLSearchParams(location.search);
        let orderId = params.get("bold-order-id") || params.get("order_id") || params.get("orderId");
        if (!orderId) { try { orderId = localStorage.getItem("sincity_last_order"); } catch (e) {} }
        const txStatus = (params.get("bold-tx-status") || "").toLowerCase();
        let polls = 0;
        let dibujado = false;

        const $ = id => document.getElementById(id);

        function el(tag, cls, text) {
            const n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text !== undefined) n.textContent = text;
            return n;
        }
        const dinero = n => '$' + Number(n).toLocaleString('es-CO');
        const tipo = t => String(t || '').toUpperCase();

        function setHeader(titulo, subtitulo) {
            $('titulo').textContent = titulo;
            if (subtitulo) $('subtitulo').textContent = subtitulo;
        }

        function setEstado(nodos) {
            const box = $('estado');
            box.innerHTML = '';
            nodos.forEach(n => box.appendChild(n));
            box.style.display = nodos.length ? 'block' : 'none';
        }

        function link(texto, href) {
            const a = el('a', 'back-button', texto);
            a.href = href;
            return a;
        }

        function resumen(o) {
            const r = $('resumen');
            r.innerHTML = '';
            [['Acceso:', tipo(o.access_type)], ['Cantidad:', String(o.quantity)], ['Comprador:', o.full_name || ''], ['# de reserva:', o.id]].forEach(f => {
                const row = el('div', 'price-item');
                row.appendChild(el('span', '', f[0]));
                row.appendChild(el('span', '', f[1]));
                r.appendChild(row);
            });
            const total = el('div', 'price-total');
            total.appendChild(el('span', '', 'TOTAL:'));
            total.appendChild(el('span', '', dinero(o.total)));
            r.appendChild(total);
            r.style.display = 'block';
        }

        function dibujarBoletas(o) {
            if (dibujado) return;
            dibujado = true;
            setHeader('¡PAGO CONFIRMADO!', 'Estas son tus boletas. Presenta el QR en la puerta.');
            setEstado([]);
            resumen(o);

            const cont = $('boletas');
            cont.innerHTML = '';
            (o.tickets || []).forEach(t => {
                const card = el('div', 'ticket');
                card.appendChild(el('h3', '', 'BOLETA ' + t.n + ' DE ' + t.total));
                card.appendChild(el('div', 'who', tipo(t.access_type) + ' · ' + (o.full_name || '')));

                const box = el('div', 'qr-box');
                card.appendChild(box);
                try {
                    new QRCode(box, { text: t.qr_payload, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
                } catch (e) {
                    box.textContent = 'No se pudo dibujar el QR. Código: ' + t.qr_payload;
                }
                card.appendChild(el('div', 'token', t.qr_payload));

                const dl = el('button', 'checkout-button', 'Descargar QR');
                dl.type = 'button';
                dl.addEventListener('click', () => {
                    const c = box.querySelector('canvas');
                    const img = box.querySelector('img');
                    const href = c ? c.toDataURL('image/png') : (img ? img.src : null);
                    if (!href) return;
                    const a = document.createElement('a');
                    a.href = href;
                    a.download = 'sincity-boleta-' + t.n + '.png';
                    document.body.appendChild(a); a.click(); a.remove();
                });
                card.appendChild(dl);
                cont.appendChild(card);
            });
            cont.appendChild(el('p', 'hint', 'Toma captura de pantalla o descarga los QR. Cada QR sirve para una sola persona.'));
        }

        function fallo(titulo, mensaje, extra) {
            setHeader(titulo);
            const p = el('p', '', mensaje);
            const nodos = [p];
            if (extra) nodos.push(extra);
            setEstado(nodos);
        }

        function reintentar(mensajeError, orden) {
            polls++;
            if (polls > MAX_POLLS) {
                const wrap = el('div', 'actions');
                const b = el('button', 'checkout-button', 'Revisar de nuevo');
                b.type = 'button';
                b.addEventListener('click', () => { polls = 0; setEstado([el('div', 'spinner'), el('p', '', 'Verificando…')]); consultar(); });
                wrap.appendChild(b);
                setHeader('AÚN NO VEMOS TU PAGO');
                setEstado([el('p', '', mensajeError || 'Si ya pagaste, tu boleta llegará en unos minutos. Guarda esta página y vuelve a abrirla.'), wrap]);
                return;
            }
            setHeader('CONFIRMANDO TU PAGO');
            setEstado([el('div', 'spinner'), el('p', '', 'Esto puede tardar unos segundos. No cierres esta página.')]);
            if (orden) resumen(orden);
            setTimeout(consultar, POLL_MS);
        }

        function consultar() {
            fetch(ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', apikey: ANON_KEY },
                body: JSON.stringify({ order_id: orderId })
            })
            .then(r => r.json().then(d => ({ ok: r.ok, status: r.status, data: d })))
            .then(res => {
                if (!res.ok) {
                    if (res.status === 404 || res.status === 400) {
                        return fallo('NO ENCONTRAMOS TU RESERVA', 'Revisa el enlace o escríbenos con tu número de reserva.', link('Ir al inicio', 'index.html'));
                    }
                    return reintentar('No pudimos consultar tu reserva.');
                }
                const o = res.data;
                if (o.status === 'pagado' && o.tickets && o.tickets.length) return dibujarBoletas(o);
                if (o.status === 'fallido' || txStatus === 'rejected' || txStatus === 'failed') {
                    resumen(o);
                    return fallo('EL PAGO NO SE COMPLETÓ', 'No se te cobró. Puedes intentarlo de nuevo.', link('Intentar de nuevo', 'checkout.html'));
                }
                reintentar(null, o);
            })
            .catch(() => reintentar('No pudimos conectar con el servidor.'));
        }

        if (!orderId) {
            fallo('NO ENCONTRAMOS TU RESERVA', 'No recibimos el número de reserva.', link('Ir al inicio', 'index.html'));
        } else {
            consultar();
        }
    </script>
</body>
</html>
